version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:24.21.0-browsers
    working_directory: ~/repo
    environment:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - checkout
      - restore_cache:
          keys:
            - v3-npm-{{ checksum "package-lock.json" }}-{{ checksum "lib/@uncharted.software/stories-facets/package-lock.json" }}
      # The browsers image includes system prerequisites, not necessarily Chrome.
      - run:
          name: Install stable Chrome
          command: |
            curl --fail --show-error --location --retry 3 \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              --output /tmp/facetkey-google-chrome.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/facetkey-google-chrome.deb
      - run: npm ci --ignore-scripts
      - run: npm run vendor:install
      - save_cache:
          key: v3-npm-{{ checksum "package-lock.json" }}-{{ checksum "lib/@uncharted.software/stories-facets/package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run validate
      - store_artifacts:
          path: dist
